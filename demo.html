<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entropix Demo Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="text-white min-h-screen">
    <!-- HEADER -->
    <header
      class="fixed w-full z-50 bg-[#030712]/80 backdrop-blur-md border-b border-white/10"
    >
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center"
      >
        <!-- LOGO -->
        <div class="flex items-center gap-2">
          <img src="images/logo2.png" class="h-10" />
          <img src="images/ChatGPT Image 1.png" class="h-10" />
        </div>

        <!-- NAV -->
        <nav
          class="hidden md:flex gap-10 text-xs tracking-widest text-gray-400"
        >
          <a href="index.html" class="text-cyan-400 border-b-2 border-cyan-400 pb-1"
            >HOME</a
          >
          <a href="index.html#services" class="hover:text-white">SERVICES</a>
          <a href="index.html#about" class="hover:text-white">ABOUT</a>
          <a href="#" class="hover:text-white">METHODOLOGY</a>
          <a href="#contact" class="hover:text-white">CONTACT</a>
        </nav>

        <!-- CTA -->
        <button
          class="bg-gradient-to-r from-cyan-400 to-blue-500 text-black px-6 py-2 text-xs font-bold tracking-widest"
        >
          GET OPTIMIZATION
        </button>
      </div>
    </header>

    <div class="max-w-6xl mx-auto px-6 pt-32 pb-20">
      <div>
          <p class="text-cyan-400 tracking-[0.3em] text-sm mb-6">
           OUR PRODUCT
          </p>

          <!-- BIG TEXT -->
          <h1 class="entropix-text text-5xl md:text-3xl mb-4">ENTROPIX SOLUTIONS</h1>
        <h2
            class="entropix-text text-2xl md:text-sm mb-8 bg-gradient-to-r from-purple-500 to-cyan-400 bg-clip-text text-transparent tracking-[0.4em]"
          >
            
          </h2>
      </div>

      <div class="bg-[#08101d] rounded-3xl border border-cyan-400/20 p-6 shadow-2xl shadow-cyan-500/10">
        <video controls class="w-full rounded-2xl bg-black">
          <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>

      <div class="mt-10">
        <a href="index.html" class="bg-gradient-to-r from-cyan-400 to-blue-500 text-black px-6 py-2 text-xs font-bold tracking-widest transition" rel="noopener noreferrer">
          Return to Homepage
        </a>
      </div>
    </div>
  </body>
</html>
